api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--servicebus
        value: '{{ .Env.SERVICEBUS_SERVICEBUSENDPOINT }}'
      - name: jwt--signingkey
        value: '{{ securedParameter "jwt_signing_key" }}'
      - name: cache-password
        keyVaultUrl: '{{ .Env.CACHE_KV_VAULTURI }}secrets/primaryaccesskey--cache'
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
      - name: connectionstrings--cache
        keyVaultUrl: '{{ .Env.CACHE_KV_VAULTURI }}secrets/connectionstrings--cache'
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
  template:
    containers:
      - image: {{ .Image }}
        name: basket
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: CACHE_HOST
            value: '{{ .Env.CACHE_HOSTNAME }}'
          - name: CACHE_PORT
            value: "10000"
          - name: CATALOG_HTTP
            value: http://catalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: CATALOG_HTTPS
            value: https://catalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: SERVICEBUS_HOST
            value: '{{ .Env.SERVICEBUS_SERVICEBUSHOSTNAME }}'
          - name: SERVICEBUS_URI
            value: '{{ .Env.SERVICEBUS_SERVICEBUSENDPOINT }}'
          - name: services__catalog__http__0
            value: http://catalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__catalog__https__0
            value: https://catalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: ConnectionStrings__servicebus
            secretRef: connectionstrings--servicebus
          - name: Jwt__SigningKey
            secretRef: jwt--signingkey
          - name: CACHE_PASSWORD
            secretRef: cache-password
          - name: ConnectionStrings__cache
            secretRef: connectionstrings--cache
    scale:
      minReplicas: 1
tags:
  azd-service-name: basket
  aspire-resource-name: basket
