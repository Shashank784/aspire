api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: identitydb-password
        value: '{{ securedParameter "postgres_password" }}'
      - name: identitydb-uri
        value: postgresql://{{ parameter "postgres_username" }}:{{ securedParameter "postgres_password" }}@{{ .Env.POSTGRES_HOSTNAME }}/identitydb
      - name: jwt--signingkey
        value: '{{ securedParameter "jwt_signing_key" }}'
      - name: connectionstrings--identitydb
        keyVaultUrl: '{{ .Env.POSTGRES_KV_VAULTURI }}secrets/connectionstrings--identitydb'
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
  template:
    containers:
      - image: {{ .Image }}
        name: identity
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: IDENTITYDB_DATABASENAME
            value: identitydb
          - name: IDENTITYDB_HOST
            value: '{{ .Env.POSTGRES_HOSTNAME }}'
          - name: IDENTITYDB_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://{{ .Env.POSTGRES_HOSTNAME }}/identitydb?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
          - name: IDENTITYDB_PORT
            value: "5432"
          - name: IDENTITYDB_USERNAME
            value: '{{ parameter "postgres_username" }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: IDENTITYDB_PASSWORD
            secretRef: identitydb-password
          - name: IDENTITYDB_URI
            secretRef: identitydb-uri
          - name: Jwt__SigningKey
            secretRef: jwt--signingkey
          - name: ConnectionStrings__identitydb
            secretRef: connectionstrings--identitydb
    scale:
      minReplicas: 1
tags:
  azd-service-name: identity
  aspire-resource-name: identity
