api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--servicebus
        value: '{{ .Env.SERVICEBUS_SERVICEBUSENDPOINT }}'
      - name: jwt--signingkey
        value: '{{ securedParameter "jwt_signing_key" }}'
      - name: ordersdb-password
        value: '{{ securedParameter "postgres_password" }}'
      - name: ordersdb-uri
        value: postgresql://{{ parameter "postgres_username" }}:{{ securedParameter "postgres_password" }}@{{ .Env.POSTGRES_HOSTNAME }}/ordersdb
      - name: connectionstrings--ordersdb
        keyVaultUrl: '{{ .Env.POSTGRES_KV_VAULTURI }}secrets/connectionstrings--ordersdb'
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
  template:
    containers:
      - image: {{ .Image }}
        name: orders
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: BASKET_HTTP
            value: http://basket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: BASKET_HTTPS
            value: https://basket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: ORDERSDB_DATABASENAME
            value: ordersdb
          - name: ORDERSDB_HOST
            value: '{{ .Env.POSTGRES_HOSTNAME }}'
          - name: ORDERSDB_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://{{ .Env.POSTGRES_HOSTNAME }}/ordersdb?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
          - name: ORDERSDB_PORT
            value: "5432"
          - name: ORDERSDB_USERNAME
            value: '{{ parameter "postgres_username" }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: SERVICEBUS_HOST
            value: '{{ .Env.SERVICEBUS_SERVICEBUSHOSTNAME }}'
          - name: SERVICEBUS_URI
            value: '{{ .Env.SERVICEBUS_SERVICEBUSENDPOINT }}'
          - name: services__basket__http__0
            value: http://basket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__basket__https__0
            value: https://basket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: ConnectionStrings__servicebus
            secretRef: connectionstrings--servicebus
          - name: Jwt__SigningKey
            secretRef: jwt--signingkey
          - name: ORDERSDB_PASSWORD
            secretRef: ordersdb-password
          - name: ORDERSDB_URI
            secretRef: ordersdb-uri
          - name: ConnectionStrings__ordersdb
            secretRef: connectionstrings--ordersdb
    scale:
      minReplicas: 1
tags:
  azd-service-name: orders
  aspire-resource-name: orders
